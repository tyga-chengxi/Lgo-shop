server:
  port: 8080  # 项目端口，被占用可改8081

spring:
  application:
    name: lgo-admin  #【Day1框架升级适配】
  profiles:
    active: dev # 保留原有开发环境配置
  servlet:
    multipart:
      enabled: true # 开启文件上传
      max-file-size: 10MB # 限制文件上传大小为10M
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # ========== MySQL 核心配置（已适配8.0兼容）==========
  datasource:
    url: jdbc:mysql://localhost:3306/lgo_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true  #【Day1框架升级适配】
    username: root  # 本地MySQL默认账号
    password: 200410  # 你的MySQL密码（已确认正确）
    driver-class-name: com.mysql.cj.jdbc.Driver
  # ========== Redis 核心配置（适配你的无密码环境）==========

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 5000
      database: 0

# ========== 保留你原有配置（适配lgo项目）==========  #【Day1框架升级适配】
mybatis-plus:  #【Day1框架升级适配】
  mapper-locations:
    - classpath:mapper/*.xml
    - classpath*:com/**/mapper/*.xml

jwt:
  tokenHeader: Authorization # JWT存储的请求头
  secret: lgo-admin-secret # JWT加解密使用的密钥  #【Day1框架升级适配】
  expiration: 604800 # JWT的超期限时间(60*60*24*7)
  tokenHead: 'Bearer '  # JWT负载中拿到开头

# Redis自定义配置（和spring.redis区分开）
redis:  # 原redis节点重命名，避免和spring.redis冲突
  database: lgo  #【Day1框架升级适配】
  key:
    admin: 'ums:admin'
    resourceList: 'ums:resourceList'
  expire:
    common: 86400 # 24小时

secure:
  ignored:
    urls: # 安全路径白名单
      - /swagger-ui/
      - /swagger-resources/**
      - /**/v2/api-docs
      - /**/*.html
      - /**/*.js
      - /**/*.css
      - /**/*.png
      - /**/*.map
      - /favicon.ico
      - /actuator/**
      - /druid/**
      - /admin/login
      - /admin/register
      - /admin/info
      - /admin/logout
      - /minio/upload
      - /api/lgo/** #【Day1框架升级适配】

aliyun:
  oss:
    endpoint: oss-cn-shenzhen.aliyuncs.com # oss对外服务的访问域名
    accessKeyId: test # 测试用，无需修改
    accessKeySecret: test # 测试用，无需修改
    bucketName: lgo-oss # oss的存储空间  #【Day1框架升级适配】
    policy:
      expire: 300 # 签名有效期(S)
    maxSize: 10 # 上传文件大小(M)
    callback: http://39.98.190.128:8080/aliyun/oss/callback # 测试回调地址
    dir:
      prefix: lgo/images/ # 上传文件夹路径前缀  #【Day1框架升级适配】